services:

  # ─── Consul Server (control plane) ───
  consul:
    image: hashicorp/consul:1.18
    container_name: consul-server
    command: agent -config-file=/consul/config/server.hcl
    ports:
      - "8500:8500"
    volumes:
      - ./consul-config/server.hcl:/consul/config/server.hcl:ro
    networks:
      - mesh-net

  # ─── Backend Replica 1 ───
  backend-agent-1:
    image: hashicorp/consul:1.18
    container_name: mesh-backend-agent-1
    depends_on:
      - consul
    networks:
      - mesh-net
    volumes:
      - ./consul-config/agent-backend.hcl:/consul/config/agent.hcl:ro
      - ./consul-config/backend-service.hcl:/consul/config/backend-service.hcl:ro
    command: >
      agent
      -node=backend-node-1
      -retry-join=consul-server
      -bind=0.0.0.0
      -client=0.0.0.0

  backend-1:
    image: testapp-backend:latest
    pull_policy: never
    container_name: mesh-backend-1
    network_mode: "service:backend-agent-1"
    depends_on:
      - backend-agent-1

  backend-sidecar-1:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: mesh-backend-sidecar-1
    depends_on:
      - backend-agent-1
    network_mode: "service:backend-agent-1"
    entrypoint: /bin/sh
    command: >
      -c "
      until wget -q -O- http://localhost:8500/v1/status/leader > /dev/null 2>&1; do sleep 2; done;
      consul connect envoy
      -sidecar-for backend-1
      -http-addr=localhost:8500
      -grpc-addr=localhost:8502
      -admin-bind 0.0.0.0:19000
      "

  # ─── Backend Replica 2 ───
  backend-agent-2:
    image: hashicorp/consul:1.18
    container_name: mesh-backend-agent-2
    depends_on:
      - consul
    networks:
      - mesh-net
    volumes:
      - ./consul-config/agent-backend-2.hcl:/consul/config/agent.hcl:ro
      - ./consul-config/backend-service-2.hcl:/consul/config/backend-service.hcl:ro
    command: >
      agent
      -node=backend-node-2
      -retry-join=consul-server
      -bind=0.0.0.0
      -client=0.0.0.0

  backend-2:
    image: testapp-backend:latest
    pull_policy: never
    container_name: mesh-backend-2
    network_mode: "service:backend-agent-2"
    depends_on:
      - backend-agent-2

  backend-sidecar-2:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: mesh-backend-sidecar-2
    depends_on:
      - backend-agent-2
    network_mode: "service:backend-agent-2"
    entrypoint: /bin/sh
    command: >
      -c "
      until wget -q -O- http://localhost:8500/v1/status/leader > /dev/null 2>&1; do sleep 2; done;
      consul connect envoy
      -sidecar-for backend-2
      -http-addr=localhost:8500
      -grpc-addr=localhost:8502
      -admin-bind 0.0.0.0:19002
      "

  # ─── Backend Replica 3 ───
  backend-agent-3:
    image: hashicorp/consul:1.18
    container_name: mesh-backend-agent-3
    depends_on:
      - consul
    networks:
      - mesh-net
    volumes:
      - ./consul-config/agent-backend-3.hcl:/consul/config/agent.hcl:ro
      - ./consul-config/backend-service-3.hcl:/consul/config/backend-service.hcl:ro
    command: >
      agent
      -node=backend-node-3
      -retry-join=consul-server
      -bind=0.0.0.0
      -client=0.0.0.0

  backend-3:
    image: testapp-backend:latest
    pull_policy: never
    container_name: mesh-backend-3
    network_mode: "service:backend-agent-3"
    depends_on:
      - backend-agent-3

  backend-sidecar-3:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: mesh-backend-sidecar-3
    depends_on:
      - backend-agent-3
    network_mode: "service:backend-agent-3"
    entrypoint: /bin/sh
    command: >
      -c "
      until wget -q -O- http://localhost:8500/v1/status/leader > /dev/null 2>&1; do sleep 2; done;
      consul connect envoy
      -sidecar-for backend-3
      -http-addr=localhost:8500
      -grpc-addr=localhost:8502
      -admin-bind 0.0.0.0:19003
      "

  # ─── Frontend (unchanged) ───
  frontend-agent:
    image: hashicorp/consul:1.18
    container_name: mesh-frontend-agent
    depends_on:
      - consul
    networks:
      - mesh-net
    ports:
      - "8081:8080"
      - "9191:9191"
    volumes:
      - ./consul-config/agent-frontend.hcl:/consul/config/agent.hcl:ro
      - ./consul-config/frontend-service.hcl:/consul/config/frontend-service.hcl:ro
    command: >
      agent
      -node=frontend-node
      -retry-join=consul-server
      -bind=0.0.0.0
      -client=0.0.0.0

  frontend:
    image: testapp-frontend:latest
    pull_policy: never
    container_name: mesh-frontend
    environment:
      - BACKEND_URL=http://localhost:9191
    network_mode: "service:frontend-agent"
    depends_on:
      - frontend-agent

  frontend-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: mesh-frontend-sidecar
    depends_on:
      - frontend-agent
    network_mode: "service:frontend-agent"
    entrypoint: /bin/sh
    command: >
      -c "
      until wget -q -O- http://localhost:8500/v1/status/leader > /dev/null 2>&1; do sleep 2; done;
      consul connect envoy
      -sidecar-for frontend-1
      -http-addr=localhost:8500
      -grpc-addr=localhost:8502
      -admin-bind 0.0.0.0:19001
      "

networks:
  mesh-net:
    driver: bridge